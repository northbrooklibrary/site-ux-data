name: Receive UX session CSV

on:
  repository_dispatch:
    types: [ux-session-submitted]

permissions:
  contents: write

jobs:
  commit-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch || 'main' }}

      - name: Write CSV to data folder
        run: |
          mkdir -p "${{ github.event.client_payload.folder || 'data' }}"
          printf '%s' '${{ github.event.client_payload.csv }}' > "${{ github.event.client_payload.folder || 'data' }}/${{ github.event.client_payload.filename }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.client_payload.folder || 'data' }}/${{ github.event.client_payload.filename }}"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add UX session: ${{ github.event.client_payload.filename }}"
            git push
          fi
